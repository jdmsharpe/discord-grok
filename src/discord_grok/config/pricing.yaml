# xAI Grok pricing catalog.
#
# Canonical source: https://docs.x.ai/docs/models
# Long-context tiers: per-model pages at https://docs.x.ai/developers/models/<model>
# Secondary cross-reference (KNOWN STALE for xAI — docs.x.ai wins on any conflict):
#   https://github.com/pydantic/genai-prices/blob/main/prices/providers/x_ai.yml
#   It still carried grok-4.5's retired $0.50/M cached rate on 2026-07-24 and would
#   have masked that drift, so verify against docs.x.ai first and treat it as a hint.
# Last-verified: 2026-08-18
#
# Chat pricing is organized by pricing class (premium / fast / mini / etc.).
# The model → class mapping lives in command_options.py alongside the catalog;
# this file owns only the class → price mapping so several models can share
# identical pricing without duplication.
#
# Override this file at runtime by setting XAI_PRICING_PATH to an alternate
# YAML path — useful for pushing new pricing without a code release.

# Per-million-token triples: (input, cached_input, output)
#
# Classes with a `long_context` block have a second pricing tier: per docs.x.ai,
# "Requests whose prompt reaches 200k tokens are billed at the higher rate for
# all tokens in the request" — so once a request's PROMPT token count reaches
# threshold_tokens, ALL of its tokens (input, cached input, and output) bill at
# the long_context rates, not just the overflow. Classes without the block bill
# flat at any prompt size.
pricing_classes:
  flagship:
    input_per_million: 1.25
    cached_input_per_million: 0.20
    output_per_million: 2.50
    long_context: { threshold_tokens: 200000, input_per_million: 2.50, cached_input_per_million: 0.40, output_per_million: 5.00 }
  # grok-4.6 matches grok-4.5's $2.00/$6.00 input/output but cannot share its class:
  # it caches at $0.50/M, not $0.30/M (and $1.00 vs $0.60 long-context).
  grok_4_6:
    input_per_million: 2.00
    cached_input_per_million: 0.50
    output_per_million: 6.00
    long_context: { threshold_tokens: 200000, input_per_million: 4.00, cached_input_per_million: 1.00, output_per_million: 12.00 }
  # grok-4.5 matches `premium`'s $2.00/$6.00 input/output but still cannot share it:
  # it caches at $0.30/M — 1.5x `premium`'s $0.20 — and, unlike `premium`, it
  # doubles every rate once a prompt reaches 200k tokens.
  grok_4_5:
    input_per_million: 2.00
    cached_input_per_million: 0.30
    output_per_million: 6.00
    long_context: { threshold_tokens: 200000, input_per_million: 4.00, cached_input_per_million: 0.60, output_per_million: 12.00 }
  premium:        { input_per_million: 2.00, cached_input_per_million: 0.20, output_per_million: 6.00 }
  build:
    input_per_million: 1.00
    cached_input_per_million: 0.20
    output_per_million: 2.00
    long_context: { threshold_tokens: 200000, input_per_million: 2.00, cached_input_per_million: 0.40, output_per_million: 4.00 }
  fast:           { input_per_million: 0.20, cached_input_per_million: 0.05, output_per_million: 0.50 }
  mini:           { input_per_million: 0.30, cached_input_per_million: 0.075, output_per_million: 0.50 }

# Per-image pricing for Grok Imagine models, keyed by the `resolution` value the
# slash command sends: docs.x.ai bills Imagine output per output resolution, not
# at one flat rate per model. grok-imagine-image happens to cost the same at both
# resolutions, but it is still spelled out per resolution so every row has one shape.
# A scalar (per_image: 0.05) is still accepted and bills flat at any resolution.
# grok-imagine-image-pro is an alias of grok-imagine-image-quality (canonical);
# the row is kept for cost continuity of past requests, at the corrected price.
image_generation:
  # grok-imagine-image-2.0 prices on TWO axes — resolution and quality — unlike every
  # other Imagine row. The axes are folded into one "<resolution>/<quality>" key so the
  # normalized shape stays a flat resolution -> rate map; lookup falls back to the bare
  # resolution, then to the flat rate, so single-axis rows are unaffected.
  grok-imagine-image-2.0:
    per_image: { "1k/low": 0.04, "2k/low": 0.06, "1k/medium": 0.06, "2k/medium": 0.08 }
  grok-imagine-image-quality: { per_image: { 1k: 0.05, 2k: 0.07 } }
  grok-imagine-image-pro:     { per_image: { 1k: 0.05, 2k: 0.07 } }
  grok-imagine-image:         { per_image: { 1k: 0.02, 2k: 0.02 } }

# Per-second pricing for Grok Imagine video models, keyed by resolution the same way.
# 1080p is published by docs.x.ai for the 1.5 model but is not offered by
# /grok-media video (720p/480p only); it is priced here so adding the option later
# needs no pricing change. grok-imagine-video has no published 1080p rate.
video_generation:
  grok-imagine-video:             { per_second: { 480p: 0.05, 720p: 0.07 } }
  grok-imagine-video-1.5-preview: { per_second: { 480p: 0.08, 720p: 0.14, 1080p: 0.25 } }

# Text-to-speech is charged per million characters.
text_to_speech:
  per_million_chars: 15.00

# Server-side tool invocation pricing (dollars per 1,000 invocations).
tools:
  SERVER_SIDE_TOOL_WEB_SEARCH:         { per_1k_invocations: 5.00 }
  SERVER_SIDE_TOOL_X_SEARCH:           { per_1k_invocations: 5.00 }
  SERVER_SIDE_TOOL_CODE_EXECUTION:     { per_1k_invocations: 5.00 }
  SERVER_SIDE_TOOL_CODE_INTERPRETER:   { per_1k_invocations: 5.00 }
  SERVER_SIDE_TOOL_COLLECTIONS_SEARCH: { per_1k_invocations: 2.50 }
  SERVER_SIDE_TOOL_FILE_SEARCH:        { per_1k_invocations: 2.50 }
  SERVER_SIDE_TOOL_ATTACHMENT_SEARCH:  { per_1k_invocations: 10.00 }

fallbacks:
  # Fail high, not low: these also cover a *known* model at a resolution the
  # catalog does not price, so they carry the most expensive published tier
  # rather than the cheapest. Under-reporting a real charge is worse than
  # over-reporting an estimate the SDK's cost_usd normally supersedes.
  unknown_image_model: { per_image: 0.07 }
  unknown_video_model: { per_second: 0.25 }
